# Baja latencia ALSA del HyperX. USB es "batch": PipeWire suma period-size al headroom
# (antes 256+0 = 5,3 ms; ahora 64+0 = 1,3 ms).
# Si hay chasquidos/xruns: sube period-size a 128 o borra este archivo y
# `systemctl --user restart wireplumber`.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.usb-HP__Inc_HyperX_Virtual_Surround_Sound_00000000-00.analog-stereo" }
    ]
    actions = {
      update-props = {
        api.alsa.headroom = 0
        api.alsa.period-size = 64
      }
    }
  }
]
