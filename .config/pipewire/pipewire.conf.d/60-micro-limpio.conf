# Micro limpio: sustituye la cadena de entrada de EasyEffects.
# PCM2902 (voz solo en canal L) -> rnnoise (mono, con VAD) -> +12 dB -> L y R.
# Deshacer: borrar este archivo y `systemctl --user restart pipewire`.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "THE WILD PROJECT"
        node.nick = "THE WILD PROJECT"
      media.name       = "THE WILD PROJECT"
      filter.graph = {
        nodes = [
          {
            type   = ladspa
            name   = rnnoise
            plugin = "librnnoise_ladspa"
            label  = noise_suppressor_mono
            control = {
              # Equivale al VAD de EasyEffects. Más alto = corta más (y puede comerse sílabas).
              "VAD Threshold (%)" = 50.0
            }
          }
          # Ganancia de salida (igual que outputGain=12 de stereo_tools): 10^(12/20) = 3.98
          { type = builtin name = gainL label = linear control = { "Mult" = 3.98 } }
          { type = builtin name = gainR label = linear control = { "Mult" = 3.98 } }
        ]
        links = [
          { output = "rnnoise:Output" input = "gainL:In" }
          { output = "rnnoise:Output" input = "gainR:In" }
        ]
        # Solo el canal L del micro; el R se ignora.
        inputs  = [ "rnnoise:Input" null ]
        outputs = [ "gainL:Out" "gainR:Out" ]
      }
      capture.props = {
        node.name      = "capture.micro_limpio"
        audio.position = [ FL FR ]
        stream.dont-remix = true
        target.object  = "alsa_input.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00.analog-stereo-input"
        node.passive   = true
      }
      playback.props = {
        node.name      = "micro_limpio"
        node.description = "THE WILD PROJECT"
        node.nick = "THE WILD PROJECT"
        media.class    = Audio/Source
        audio.position = [ FL FR ]
      }
    }
  }
]
